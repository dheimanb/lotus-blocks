<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotus Blocks</title>
<style>
  :root { --ink:#2e3a34; --petal:#e8a2b4; --petal2:#f3c6d3; --water:#eef4f1; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Georgia, 'Times New Roman', serif; background:var(--water); color:var(--ink);
         min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:24px; }
  .lotus { display:grid; grid-template-columns:repeat(3, 34px); grid-template-rows:repeat(3, 34px); gap:5px; }
  .lotus div { border-radius:12px 12px 12px 2px; background:var(--petal2); }
  .lotus div:nth-child(5) { background:var(--petal); border-radius:50%; }
  .lotus div:nth-child(2), .lotus div:nth-child(4), .lotus div:nth-child(6), .lotus div:nth-child(8) { background:var(--petal); }
  h1 { font-size:2.2rem; letter-spacing:.04em; font-weight:normal; }
  p { max-width:34em; text-align:center; line-height:1.6; color:#54655c; }
  .tag { font-size:.85rem; letter-spacing:.18em; text-transform:uppercase; color:#8aa396; }
</style>
</head>
<body>
  <div class="lotus"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
  <h1>Lotus Blocks</h1>
  <p>A number-block puzzle, cut from one solved 9×9 grid.<br>Prototype in progress — the first playable board is on its way.</p>
  <p class="tag">81 squares · one lotus</p>
</body>
</html>
